<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chrome QA Fleet Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1210;
        --panel: #141b17;
        --line: #253029;
        --text: #e9f1ea;
        --muted: #8c9a90;
        --dim: #6b776f;
        --green: #75d395;
        --amber: #e8c667;
        --blue: #6fb8e0;
        --red: #ef6f6c;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        font-size: 12px;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto auto 1fr auto auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px 8px;
        border-bottom: 1px solid var(--line);
      }

      .title {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--green);
      }

      .pills {
        display: flex;
        gap: 5px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }

      .pill b {
        color: var(--text);
        font-weight: 700;
      }

      .pill.alert {
        border-color: #5c2f2f;
        color: var(--red);
      }

      .pill.alert b {
        color: var(--red);
      }

      .host {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
      }

      .controls {
        display: grid;
        gap: 7px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .target-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
      }

      .queue-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      input, button {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #101612;
        color: var(--text);
        font: 10px var(--mono);
      }

      input { padding: 7px 8px; }
      button { padding: 6px 9px; cursor: pointer; }
      button:hover { border-color: var(--green); }
      button:disabled { opacity: .45; cursor: default; }
      button.danger { margin-left: auto; color: var(--red); }
      .control-status { color: var(--dim); font: 9px var(--mono); min-height: 11px; }
      .control-status.error { color: var(--red); }

      .meter-label {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .meter-label span:last-child {
        color: var(--text);
      }

      .track {
        height: 4px;
        border-radius: 999px;
        background: #1e2722;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--green);
        transition: width 400ms ease;
      }

      .fill.warn {
        background: var(--amber);
      }

      .fill.hot {
        background: var(--red);
      }

      #sessions {
        overflow-y: auto;
        padding: 4px 0;
      }

      .row {
        display: grid;
        grid-template-columns: 22px 1fr auto auto;
        gap: 8px;
        align-items: start;
        padding: 7px 12px;
        border-bottom: 1px solid #1a221d;
      }

      .idx {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--dim);
        padding-top: 2px;
        text-align: right;
      }

      .line1 {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
        background: var(--dim);
      }

      .dot.running {
        background: var(--green);
        box-shadow: 0 0 0 3px rgb(117 211 149 / 14%);
      }
      .dot.working {
        background: var(--amber);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .dot.vpn {
        background: var(--blue);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .dot.failed {
        background: var(--red);
      }
      .dot.queued {
        background: #3f4a43;
      }

      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      .cc {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        border: 1px solid #2f4a39;
        border-radius: 4px;
        padding: 1px 4px;
        color: #a9e6c0;
        background: rgb(117 211 149 / 8%);
        flex: none;
      }

      .cc.unset {
        border-color: var(--line);
        color: var(--dim);
        background: none;
      }

      .cc.mismatch {
        border-color: #5c2f2f;
        color: var(--red);
        background: rgb(239 111 108 / 8%);
      }

      .name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .line2 {
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .line2.error {
        color: var(--red);
        white-space: normal;
      }

      .line2.warn {
        color: var(--amber);
        white-space: normal;
      }

      .metrics {
        text-align: right;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text);
        line-height: 1.5;
        flex: none;
      }

      .metrics small {
        display: block;
        color: var(--dim);
        font-size: 9px;
      }

      .reset {
        padding: 3px 5px;
        color: var(--dim);
        font-size: 9px;
      }

      .row-actions { display: flex; gap: 3px; }
      .close-profile { padding: 3px 5px; color: var(--muted); font-size: 9px; }

      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--dim);
        font-size: 11px;
      }

      .tally {
        border-top: 1px solid var(--line);
        padding: 8px 12px;
        max-height: 122px;
        overflow-y: auto;
      }

      .tally h2 {
        margin: 0 0 6px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.14em;
        color: var(--dim);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }

      .chip {
        font-family: var(--mono);
        font-size: 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 4px;
        color: var(--dim);
      }

      .chip.used {
        border-color: #35566a;
        color: var(--blue);
        background: rgb(111 184 224 / 8%);
        font-weight: 700;
      }

      .chip.connected {
        border-color: #2f4a39;
        color: #0e1f15;
        background: var(--green);
        font-weight: 700;
      }

      .chip.spent {
        color: var(--muted);
        border-style: dashed;
      }

      footer {
        display: flex;
        justify-content: space-between;
        padding: 6px 12px 8px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 9px;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">CHROME QA FLEET</span>
      <div class="pills" id="pills"></div>
    </header>

    <section class="host">
      <div>
        <div class="meter-label">
          <span>HOST RAM</span><span id="ram-text">—</span>
        </div>
        <div class="track"><div class="fill" id="ram-fill"></div></div>
      </div>
      <div>
        <div class="meter-label">
          <span id="cpu-label">HOST CPU</span><span id="cpu-text">—</span>
        </div>
        <div class="track"><div class="fill" id="cpu-fill"></div></div>
      </div>
    </section>

    <section class="controls">
      <div class="target-row">
        <input id="target-url" type="url" placeholder="https://authorized-target.example" />
        <button id="navigate-all" type="button">Open in running + queued</button>
      </div>
      <div class="queue-row">
        <button id="promote-next" type="button">Promote next queued</button>
        <span id="queue-mode" class="control-status"></span>
        <button id="stop-all" class="danger" type="button">Stop all</button>
      </div>
      <div id="control-status" class="control-status">Dashboard controls ready.</div>
    </section>

    <section id="sessions">
      <p class="empty">Waiting for the launcher…</p>
    </section>

    <section class="tally">
      <h2 id="tally-heading">VPN COUNTRY LEDGER</h2>
      <div class="chips" id="chips"></div>
    </section>

    <footer>
      <span id="mode">—</span>
      <span id="stamp">—</span>
    </footer>

    <script>
      const STATES = {
        queued: { dot: "queued", label: "Queued" },
        launching: { dot: "working", label: "Launching Chrome" },
        "vpn-signin": { dot: "vpn", label: "Signing in to VPN" },
        "vpn-connecting": { dot: "vpn", label: "Connecting VPN" },
        "vpn-connected": { dot: "vpn", label: "VPN connected" },
        "ip-check": { dot: "working", label: "Checking exit IP" },
        navigating: { dot: "working", label: "Loading target" },
        running: { dot: "running", label: "Running" },
        setup: { dot: "vpn", label: "Manual VPN setup" },
        attention: { dot: "failed", label: "Needs attention" },
        failed: { dot: "failed", label: "Failed" },
        closed: { dot: "queued", label: "Closed" },
      };

      function bytes(value) {
        if (!Number.isFinite(value) || value <= 0) return "—";
        const units = ["B", "KB", "MB", "GB", "TB"];
        let v = value;
        let u = 0;
        while (v >= 1024 && u < units.length - 1) {
          v /= 1024;
          u += 1;
        }
        return (v >= 100 || u === 0 ? Math.round(v) : v.toFixed(1)) + " " + units[u];
      }

      function meter(fillEl, textEl, percent, text) {
        const pct = Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : 0;
        fillEl.style.width = pct + "%";
        fillEl.className = "fill" + (pct >= 90 ? " hot" : pct >= 70 ? " warn" : "");
        textEl.textContent = text;
      }

      function pill(label, value, alert) {
        return (
          '<span class="pill' + (alert ? " alert" : "") + '">' +
          label + " <b>" + value + "</b></span>"
        );
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[ch]);
      }

      function renderSession(session) {
        const country = session.country;
        const mismatch = session.geoOk === false;
        const connected = session.vpnCheck === "connected" && session.geoOk === true;
        const meta = connected
          ? { dot: "running", label: "VPN connected" }
          : STATES[session.state] || { dot: "queued", label: session.state };
        const ccClass = country ? (mismatch ? "cc mismatch" : "cc") : "cc unset";
        const cc = country ? country.code : "··";
        const title = country
          ? country.name + (connected ? " · VPN connected" : "")
          : session.vpnEnabled ? "Awaiting country" : "Direct";

        const statusDetail = session.vpnCheck === "checking"
          ? "Checking VPN exit…"
          : connected
            ? ["VPN connected", session.ip, session.ipCountry && "exit " + session.ipCountry]
                .filter(Boolean).join(" · ")
            : session.vpnCheck === "not-installed"
              ? "Surfshark not detected yet · manual setup"
              : session.ip || meta.label;

        const fault = session.error || session.warning;
        const detail = fault
          ? '<div class="line2 ' +
            (session.error ? "error" : "warn") +
            '">' + escapeHtml(fault) + "</div>"
          : '<div class="line2">' +
            escapeHtml(
              [
                statusDetail,
                session.ipCountry && country && session.ipCountry !== country.code
                  ? "exit " + session.ipCountry
                  : session.city,
                session.viewport,
              ].filter(Boolean).join(" · "),
            ) +
            "</div>";

        return (
          '<div class="row">' +
          '<div class="idx">' + session.index + "</div>" +
          "<div>" +
          '<div class="line1">' +
          '<span class="dot ' + meta.dot + '"></span>' +
          '<span class="' + ccClass + '">' + escapeHtml(cc) + "</span>" +
          '<span class="name">' + escapeHtml(title) + "</span>" +
          "</div>" + detail +
          "</div>" +
          '<div class="metrics">' +
          escapeHtml(bytes(session.rssBytes)) +
          "<small>" +
          (Number.isFinite(session.cpuPercent) ? session.cpuPercent.toFixed(1) + "% cpu" : "—") +
          "</small></div>" +
          '<div class="row-actions">' +
          (session.state !== "queued" && session.state !== "closed" && session.state !== "failed"
            ? '<button class="close-profile" data-close="' + session.index + '" title="Close and keep this profile">Close</button>'
            : "") +
          '<button class="reset" data-reset="' + session.index + '" title="Delete this saved profile">Reset</button>' +
          "</div>" +
          "</div>"
        );
      }

      async function command(payload, workingText) {
        const status = document.getElementById("control-status");
        status.className = "control-status";
        status.textContent = workingText;
        if (typeof window.__fleetCommand !== "function") {
          status.className = "control-status error";
          status.textContent = "Dashboard command bridge is unavailable.";
          return null;
        }
        const response = await window.__fleetCommand(payload);
        status.className = "control-status" + (response.ok ? "" : " error");
        status.textContent = response.ok ? "Done." : response.error;
        return response;
      }

      document.getElementById("navigate-all").addEventListener("click", () => {
        void command(
          { action: "navigate", url: document.getElementById("target-url").value },
          "Updating target and navigating running profiles…",
        );
      });
      document.getElementById("promote-next").addEventListener("click", () => {
        void command({ action: "promoteNext" }, "Promoting the next profile…");
      });
      document.getElementById("stop-all").addEventListener("click", () => {
        if (confirm("Close every launched Chrome and cancel the queue?")) {
          void command({ action: "stopAll" }, "Stopping all profiles…");
        }
      });
      document.getElementById("sessions").addEventListener("click", (event) => {
        const closeButton = event.target.closest("[data-close]");
        if (closeButton) {
          void command(
            { action: "closeProfile", index: Number(closeButton.dataset.close) },
            "Closing profile " + closeButton.dataset.close + "…",
          );
          return;
        }
        const button = event.target.closest("[data-reset]");
        if (!button) return;
        const index = Number(button.dataset.reset);
        if (confirm("Reset persistent profile " + index + "? Its cookies, login and cache will be deleted.")) {
          void command({ action: "resetProfile", index }, "Resetting profile " + index + "…");
        }
      });

      window.__fleetUpdate = function (snapshot) {
        const run = snapshot.run || {};
        document.getElementById("pills").innerHTML =
          pill("ACTIVE", run.active ?? 0) +
          pill("QUEUED", run.queued ?? 0) +
          (run.failed ? pill("FAILED", run.failed, true) : "");
        const targetInput = document.getElementById("target-url");
        if (document.activeElement !== targetInput && run.targetUrl) {
          targetInput.value = run.targetUrl;
        }
        document.getElementById("promote-next").disabled =
          !run.queued || run.queueMode !== "manual" || run.active >= run.activeLimit;
        document.getElementById("queue-mode").textContent =
          (run.queueMode === "manual" ? "MANUAL" : "AUTO") +
          " QUEUE · LIMIT " + (run.activeLimit ?? 20);

        const host = snapshot.host || {};
        if (Number.isFinite(host.totalBytes) && host.totalBytes > 0) {
          meter(
            document.getElementById("ram-fill"),
            document.getElementById("ram-text"),
            (host.usedBytes / host.totalBytes) * 100,
            bytes(host.usedBytes) + " / " + bytes(host.totalBytes),
          );
        }
        document.getElementById("cpu-label").textContent =
          "HOST CPU" + (host.cores ? " · " + host.cores + " CORES" : "");
        meter(
          document.getElementById("cpu-fill"),
          document.getElementById("cpu-text"),
          host.cpuPercent,
          Number.isFinite(host.cpuPercent) ? host.cpuPercent.toFixed(0) + "%" : "—",
        );

        const sessions = snapshot.sessions || [];
        document.getElementById("sessions").innerHTML = sessions.length
          ? sessions.map(renderSession).join("")
          : '<p class="empty">No sessions yet.</p>';

        const countries = snapshot.countries || [];
        document.getElementById("tally-heading").textContent =
          "VPN COUNTRY LEDGER · " +
          countries.filter((c) => c.connected).length + " CONNECTED · " +
          countries.filter((c) => c.inUse).length + " OPEN / " + countries.length;
        document.getElementById("chips").innerHTML = countries.length
          ? countries
              .map(
                (c) =>
                  '<span class="chip ' +
                  (c.connected ? "connected" : c.inUse ? "used" : c.useCount > 0 ? "spent" : "") +
                  '" title="' + escapeHtml(c.name) +
                  (c.holder ? " → " + escapeHtml(c.holder) : "") +
                  (c.ip ? " · " + escapeHtml(c.ip) : "") + '">' +
                  escapeHtml(c.code) + "</span>",
              )
              .join("")
          : '<span class="chip">VPN mode off</span>';

        document.getElementById("mode").textContent = run.vpnEnabled
          ? "SURFSHARK VPN"
          : run.directMode
            ? "DIRECT (NO PROXY)"
            : "IPROYAL PROXY";
        document.getElementById("stamp").textContent = new Date(
          snapshot.generatedAt || Date.now(),
        ).toLocaleTimeString();
      };

      window.__fleetReady = true;
    </script>
  </body>
</html>
